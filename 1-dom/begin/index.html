<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Frontend System Design Fundamentals</title>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <main id="container"></main>
  <template id="card-template">
    <article class="card">
      <h3 class="card__title"></h3>
      <div class="card__body">
        <div class='card__body__image'></div>
        <section class='card__body__content'>
        </section>
      </div>
    </article>
  </template>
</body>
<script>
  const container = document.getElementById('container');

  /**
   * @param {string} title
   * @param {string} body
   *
   * @return {HTMLElement
   */
  function createCardComponent(title, body) {
    const card = document.getElementById('card-template').content.cloneNode(true).firstElementChild;

    card.querySelector('.card__title').textContent = title;
    card.querySelector('.card__body__content').textContent = body;

    return card
  }


  const component = createCardComponent(
    "Frontend System Design: Fundamentals",
    "This is a random body text"
  );

  container.appendChild(component);
</script>

</html>
